name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # full history so `git describe` stamps real versions on tag builds
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: fmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...

      - name: test
        run: go test ./...

      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          go build -ldflags "-s -w -X main.version=${VERSION}" -o q8s-linux-${{ matrix.goarch }} ./cmd/q8s/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: q8s-linux-${{ matrix.goarch }}
          path: q8s-linux-${{ matrix.goarch }}

  # End-to-end suite: real kubectl against a standalone `q8s serve` on an
  # ephemeral port (Q8S_E2E_PORT default 16443 — never collides with an
  # installed instance). The systemd socket-management section self-skips
  # where no q8s is installed.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: install kubectl (checksum-verified)
        run: |
          KUBECTL_VERSION=v1.33.0
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

      - name: build
        run: go build -o /tmp/q8s-e2e ./cmd/q8s/

      - name: generate certs (install without a systemd session)
        # The e2e suite runs a standalone `q8s serve` but needs TLS certs to
        # exist first (q8s kubeconfig/serve read them, they are not
        # auto-generated). `q8s install` generates them; its systemd
        # daemon-reload is non-fatal on a runner with no user manager, so
        # install exits 0 with the certs written.
        run: /tmp/q8s-e2e install

      - name: run e2e
        run: |
          python3 -m pip install --user pexpect
          python3 e2e_test.py

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            q8s-linux-amd64
            q8s-linux-arm64
